# Sveltia CMS configuration.
# Edits made in the CMS are committed straight to this GitHub repo, which
# triggers the host to rebuild and redeploy. Mirrors the Zod schemas in
# src/content.config.ts — keep the two in sync if you change fields.

backend:
  name: github
  repo: IanStacked/samhorse
  branch: main
  # One-click "Sign in with GitHub" via the Sveltia CMS Authenticator worker.
  # This is the worker root (no /callback) — the GitHub OAuth app's callback URL
  # is this value + /callback.
  base_url: https://sveltia-cms-auth.ian-rodgers156.workers.dev

# Default upload location; overridden per image field below so the saved path
# is a relative import that Astro's <Image /> can optimize.
media_folder: src/assets
public_folder: /src/assets

collections:
  - name: horses
    label: Horses
    label_singular: Horse
    folder: src/content/horses
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{name}} ({{breed}})"
    fields:
      - { name: name, label: Name, widget: string }
      - { name: breed, label: Breed, widget: string }
      - { name: discipline, label: Discipline, widget: string }
      - { name: foaled, label: Foaled (birth year), widget: number, value_type: int, min: 1980, max: 2035 }
      - name: photo
        label: Photo
        widget: image
        media_folder: /src/assets/horses
        public_folder: ../../assets/horses
      - { name: body, label: Bio, widget: markdown }

  # Collection id/folder stay "tournaments" (the data on disk didn't move) —
  # only the label changed to match the site's "Shows" rename (sh5).
  - name: tournaments
    label: Shows
    label_singular: Show
    folder: src/content/tournaments
    create: true
    extension: yaml
    format: yaml
    summary: "{{name}} — {{placement}}"
    fields:
      - { name: name, label: Event name, widget: string }
      - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, required: false }
      - { name: location, label: Location, widget: string }
      - { name: placement, label: Placement, widget: string, hint: "e.g. 1st, Reserve Champion", required: false }
      - { name: rider, label: Rider (optional), widget: string, required: false }
      - name: horse
        label: Horse ridden (optional)
        widget: relation
        required: false
        collection: horses
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
      - name: horseName
        label: Horse name (free text, only if not one of Samantha's horses above)
        widget: string
        required: false
      - name: photos
        label: Photos (optional)
        widget: list
        required: false
        field:
          name: image
          label: Image
          widget: image
          media_folder: /src/assets/photos
          public_folder: ../../assets/photos
      - name: videos
        label: Videos (YouTube links, optional)
        widget: list
        required: false
        field: { name: url, label: URL, widget: string }

  - name: photos
    label: Gallery
    label_singular: Photo
    folder: src/content/photos
    create: true
    extension: yaml
    format: yaml
    summary: "{{caption}}"
    fields:
      - name: image
        label: Image
        widget: image
        media_folder: /src/assets/photos
        public_folder: ../../assets/photos
      - { name: caption, label: Caption, widget: string }
      - name: horse
        label: Horse (optional)
        widget: relation
        required: false
        collection: horses
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
      - { name: year, label: Year, widget: number, value_type: int, min: 1990, max: 2035 }
      - name: videos
        label: Videos (YouTube links, optional)
        widget: list
        required: false
        field: { name: url, label: URL, widget: string }

  - name: accomplishments
    label: Accomplishments
    label_singular: Accomplishment
    folder: src/content/accomplishments
    create: true
    extension: yaml
    format: yaml
    summary: "{{class}} — {{position}}"
    fields:
      - { name: class, label: Class competing in, widget: string }
      - name: horse
        label: Horse (optional)
        widget: relation
        required: false
        collection: horses
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
      - { name: position, label: Position, widget: string, hint: "e.g. 1st, Reserve Champion" }
      - { name: description, label: Description, widget: text }
      - name: photos
        label: Photos (optional)
        widget: list
        required: false
        field:
          name: image
          label: Image
          widget: image
          media_folder: /src/assets/accomplishments
          public_folder: ../../assets/accomplishments
      - name: videos
        label: Videos (YouTube links, optional)
        widget: list
        required: false
        field: { name: url, label: URL, widget: string }
